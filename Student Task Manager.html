<body>

    <div class="container">
        <h1>Student Task Manager</h1>
        <p class="subtitle">Manage your study tasks easily!</p>

        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="Enter your task..." required="">
            <button type="submit">Add Task</button>
        </form>

        <div class="filters">
            <button type="button" data-filter="all">All Tasks</button>
            <button type="button" data-filter="pending">Pending</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <div>
                <h3 id="totalCount">0</h3>
                <p>Total Tasks</p>
            </div>

            <div>
                <h3 id="pendingCount">0</h3>
                <p>Pending</p>
            </div>

            <div>
                <h3 id="completedCount">0</h3>
                <p>Completed</p>
            </div>
        </div>

        <h2>My Tasks</h2>
        <ul id="taskList"></ul>

        <p id="emptyMessage" style="display: block;">No tasks yet. Add your first task!</p>

        <button type="button" id="loadSample">
            Load Sample Tasks from API
        </button>

        <p id="message" role="status"></p>
    </div>

    <script src="./Student Task Manager_files/script.js.download"></script>
